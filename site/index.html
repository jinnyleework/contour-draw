<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contour draw</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css">
<script>{ let theme; try { theme = localStorage.getItem("theme"); } catch {} document.documentElement.dataset.theme = theme || "dark"; }</script>
<script>if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("intro");</script>
</head>
<body>
<div class="field" id="stage"></div>
<div class="mill" id="mill" role="link" tabindex="0" aria-label="open the library"></div>
<header class="top">
  <a class="mark" href="index.html" aria-label="Home"><img src="assets/logo-slices.svg" alt=""></a>
  <nav aria-label="Main">
    <a href="library.html">library</a>
    <a href="play.html">play</a>
    <a href="skill.html">skill</a>
    <a href="info.html">start</a>
    <a class="tech" href="technicals.html">technicals</a>
  </nav>
</header>
<main class="home">
  <h1 class="wordmark" id="wordmark" aria-label="contour draw">
    <span class="w">contour</span><span class="slot"><img src="assets/logo-slices.svg" alt=""></span><span class="w">draw</span>
  </h1>
  <div class="stage" aria-hidden="true"></div>
  <button class="install" id="install" type="button" aria-label="Copy the first prompt">
    <span class="dollar">&gt;</span><span class="cmd">/draw-contour a windmill whose sails turn</span><span class="copied">copied</span>
  </button>
</main>
<script src="assets/contour-figures.js"></script>
<script src="assets/figure.js"></script>
<script src="assets/pull.js"></script>
<script src="assets/theme.js"></script>
<script>
  const $ = (id) => document.getElementById(id), NS = "http://www.w3.org/2000/svg";
  const btn = $("install"), cmd = btn.querySelector(".cmd");
  let COMMAND = cmd.textContent;
  // the water: still water that a drop falls into and ripples out across the whole page, once, on load
  // the drop does not come back to the top once it has fallen: it is the opening's, not the figure's (the library's tank is untouched)
  const tank = Contour.SCENES["ripple tank"];
  // the carousel turns slowly and steadily, round and round, for as long as it is on show (about nine seconds a turn)
  const ride = Contour.SCENES.carousel;
  Contour.SCENES["carousel home"] = { ...ride, T: 600, active: [0, 0], step: (t) => ({ base: {}, canopy: {}, ride: { prm: { ph: Math.round((t * 0.7) / 0.04) * 0.04 } } }) };
  // and the ripples are not sped up or faded: they calm in the middle, and that stillness spreads outwards across the page.
  // Its loop runs well past the opening's four seconds: a demo that reached its end would snap back to the rest pose, the
  // drop hanging over the water again, for the frames before the opening takes the water away
  Contour.SCENES["ripple home"] = {
    ...tank,
    T: 7,
    step(t, abs, k) {
      const s = tank.step(t, abs, k), amp = tank.step(1.5, abs, k).water.prm.a;
      if (t > 0.9) s.drop.hide = true;
      s.water.prm.a = amp;
      s.water.prm.q = Math.round((-0.3 + 1.6 * Math.max(0, t - 2.2)) * 25) / 25;     // the radius, in the water's own units, inside which it is still
      return s;
    },
  };
  const water = Contour.mount($("stage"), "ripple home", { label: "still water drawn as contour slices: a drop falls and ripples spread across it" });
  // the page is drawn to cover the window, so the ripples run out past every edge
  water.svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
  water.show();
  // the figures in the middle, one at a time, each turning on a loop until it is clicked, with the prompt that would draw it.
  // The first is the windmill; a click takes the one on show apart layer by layer and builds the next up from the ground
  const FIGURES = [
    ["windmill", "a windmill whose sails turn"],
    ["carousel home", "a carousel that spins up"],
    ["rocket", "a rocket that launches"],
    ["lightbulb", "a light bulb that switches on"],
    ["typewriter", "a typewriter that types"],
    ["jack in the box", "a jack in the box whose crank winds"],
    ["umbrella", "an umbrella that opens"],
    ["hourglass", "an hourglass whose sand runs"],
    ["terrain", "a terrain that raises a peak under the cursor"],
  ];
  const BOX = { w: 520, h: 300 };
  // the extent [x0, y0, x1, y1] of the lines in some markup
  function boxOf(markup) {
    const n = [...markup.matchAll(/[ML]([\d.-]+) ([\d.-]+)/g)].map((m) => [+m[1], +m[2]]);
    if (!n.length) return null;
    return [Math.min(...n.map((p) => p[0])), Math.min(...n.map((p) => p[1])), Math.max(...n.map((p) => p[0])), Math.max(...n.map((p) => p[1]))];
  }
  // the window onto a figure: its extent widened to the shape of the figure's box and centred, so every figure is as tall
  // as the box allows (or as wide, if it is a wide one) and sits in the middle of it, the same distance from the words above and the prompt below
  function fit([x0, y0, x1, y1]) {
    const h = Math.max(y1 - y0, (x1 - x0) * BOX.h / BOX.w), w = h * BOX.w / BOX.h;
    return [(x0 + x1) / 2 - w / 2, (y0 + y1) / 2 - h / 2, w, h];
  }
  const layerCache = {};
  const layers = (name) => (layerCache[name] ||= layersOf(name));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const mountFigure = (name) => {
    const figure = Contour.mount($("mill"), name, { label: name.replace(/ home$/, "") + ", drawn as contour slices, in motion", weight: 1 });
    figure.svg.setAttribute("viewBox", fit(layers(name).box).join(" "));
    return figure;
  };
  let shown = mountFigure("windmill"), at = 0, busy = false;
  // the first figure is measured once the ripple has played, before it comes in
  setTimeout(() => refine("windmill").then(() => { if (at === 0) shown.svg.setAttribute("viewBox", fit(layers("windmill").box).join(" ")); }), 5000);
  // a click (or Enter) on the figure moves on to the next, and round to the windmill again after the last
  async function advance() {
    if (busy) return;
    busy = true;
    const next = (at + 1) % FIGURES.length, morph = morphBetween(FIGURES[at][0], FIGURES[next][0]);
    rewrite(FIGURES[next][1]);
    await wait(morph + 100);
    shown = mountFigure(FIGURES[next][0]);
    shown.show(); shown.looping(true);
    at = next; busy = false;
    prepareAhead();
  }
  $("mill").addEventListener("click", advance);
  $("mill").addEventListener("keydown", (e) => { if (e.key === "Enter") advance(); });
  if (document.documentElement.classList.contains("intro")) opening();
  else { water.destroy(); document.documentElement.classList.add("apart"); showMill(); }

  // the windmill comes in: turning, in the middle, with the wordmark and the prompt drawn apart above and below it
  function showMill() {
    shown.show(); shown.looping(true);
    $("mill").style.pointerEvents = "auto";
    prepareAhead();
  }

  // the prompt below rewrites itself: the old one is rubbed out from the end, then the new one is typed
  let typing = 0;
  async function rewrite(prompt) {
    const id = ++typing, full = "/draw-contour " + prompt;
    COMMAND = full;
    const caret = Object.assign(document.createElement("span"), { className: "caret" });
    cmd.after(caret);
    while (cmd.textContent.length && id === typing) { cmd.textContent = cmd.textContent.slice(0, -2); await wait(8); }
    for (let i = 1; i <= full.length && id === typing; i++) { cmd.textContent = full.slice(0, i); await wait(22); }
    caret.remove();
  }

  // the cut layers of a figure as they stand at rest: each part's sheets (a moving part's at its rest pose), its pose, camera and extent
  function layersOf(name) {
    const scene = Contour.SCENES[name], svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 600 600");
    const player = Contour.createPlayer(svg, { [name]: scene }, { rule: { ...Contour.RULE, base: Contour.RULE.base } });
    player.show(name);
    const rest = scene.step(scene.active[0], 0, Contour.MOTION.intensity, null);
    return {
      box: boxOf(svg.innerHTML) || [0, 0, 600, 600], svg, player,
      cam: { S: scene.S, zm: scene.zm, zr: scene.zr },
      parts: scene.parts.map((p) => ({ order: p.order, overlay: p.overlay, pose: rest[p.id] || {}, sheets: (p.dynamic ? p.cache : p.sheets) || [] })),
    };
  }
  // widen a figure's extent to all it draws over its loop (the jack springs up, the flame hangs down), a sample at a time so the page does not stall
  async function refine(name) {
    const e = layers(name);
    if (e.refined) return;
    e.refined = true;
    const scene = Contour.SCENES[name];
    for (let i = 0; i <= 8; i++) {
      await wait(40);
      e.player.seek(i === 8 ? scene.active[1] : (scene.T * i) / 8);
      const b = boxOf(e.svg.innerHTML);
      if (b) e.box = [Math.min(e.box[0], b[0]), Math.min(e.box[1], b[1]), Math.max(e.box[2], b[2]), Math.max(e.box[3], b[3])];
    }
    delete e.player; delete e.svg;
  }
  // the next figure is cut and measured while the current one plays, so a click does not stall
  const prepareAhead = () => setTimeout(() => refine(FIGURES[(at + 1) % FIGURES.length][0]), 800);

  // one figure's layers come down one at a time from its top to the ground; then the next figure's go up from the ground.
  // Only the layers cut at or below a falling or rising height are drawn, so the figure is taken apart and built by its slices.
  // Each is framed by its own camera, so the figure that is left is exactly the one the page then plays. Returns the length in ms
  function morphBetween(fromName, toName) {
    const a = layers(fromName), b = layers(toName);
    const tag = (side, set) => set.parts.map((p, i) => ({ id: side + i, side, order: p.order, overlay: p.overlay, pose: p.pose, all: p.sheets, sheets: p.sheets }));
    const parts = [...tag("a", a), ...tag("b", b)];
    const ease = (x0, x1, t) => { const u = Math.min(1, Math.max(0, (t - x0) / (x1 - x0))); return u * u * (3 - 2 * u); };
    const HALF = 0.9;                                              // seconds to take one figure down, and as long to build the next
    const morph = {
      T: 2 * HALF + 0.1, ...b.cam, active: [2 * HALF, 2 * HALF], drive: () => 0, hint: "",
      parts,
      step(t) {
        const down = t < HALF, cam = down ? a.cam : b.cam, [z0, z1] = cam.zr, span = z1 - z0 + 0.1, st = {};
        Object.assign(morph, cam);
        svg.setAttribute("viewBox", fit((down ? a : b).box).join(" "));
        const h = down ? z1 + 0.05 - span * ease(0, HALF, t) : z0 - 0.05 + span * ease(HALF, 2 * HALF, t);
        for (const p of parts) {
          const dz = p.pose.off ? p.pose.off[2] : 0;
          p.sheets = (p.side === "a") === down ? p.all.filter((s) => s.z + dz <= h + 1e-6) : [];
          st[p.id] = { off: p.pose.off || [0, 0, 0], hide: p.pose.hide };
        }
        return st;
      },
    };
    shown.destroy();
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", fit(a.box).join(" "));
    svg.setAttribute("class", "ct");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", fromName.replace(/ home$/, "") + " taken apart layer by layer, with " + toName.replace(/ home$/, "") + " built up from the ground");
    $("mill").replaceChildren(svg);
    const player = Contour.createPlayer(svg, { morph }, { rule: { ...Contour.RULE, base: Contour.RULE.base * 0.6 } });
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) player.show("morph");
    player.demo();
    return morph.T * 1000;
  }

  /*
   * The opening: the drop falls into the water and its ripples run out across the page, then dissipate; the words fade
   * in one by one in the middle of the page; they part and the logo comes in between them, squashed flat and springing
   * up; the first prompt types itself; then the wordmark and the prompt part, and the windmill turns in the middle.
   */
  async function opening() {
    const root = document.documentElement, mark = $("wordmark"), slot = mark.querySelector(".slot"), logo = slot.querySelector("img");
    const words = [...mark.querySelectorAll(".w")], mill_el = $("mill");
    const EASE = "cubic-bezier(0.23, 1, 0.32, 1)", INOUT = "cubic-bezier(0.65, 0, 0.35, 1)";
    const run = (el, frames, o) => el.animate(frames, { fill: "forwards", easing: EASE, ...o }).finished;
    // an animation that hands the element back to its own styles when it ends, cancelling only itself
    const pass = (el, frames, o) => { const a = el.animate(frames, { fill: "forwards", easing: EASE, ...o }); return a.finished.then(() => a.cancel()); };

    // 1. the drop falls into the still water and the ripples run out across the page, then dissipate: once
    water.demo();
    await wait(3300);                       // the stillness has spread over most of the page: the words come in as the last ripples go
    setTimeout(() => water.destroy(), 700);

    // 2. the words, one by one
    words.forEach((w, i) => run(w, [{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "none" }], { duration: 420, delay: i * 140 }));
    await wait(words.length * 140 + 420 + 200);

    // 3. they part, and the logo comes in between them, squashed flat, then springs up
    const open = run(slot, [{ width: "0px", marginLeft: "-0.27em", marginRight: "0px" }, { width: "31.2px", marginLeft: "2.4px", marginRight: "2.4px" }], { duration: 520 });
    run(logo, [{ opacity: 0, transform: "scale(1.6, 0.2)" }, { opacity: 1, transform: "scale(0.86, 1.16)", offset: 0.6 }, { opacity: 1, transform: "scale(1, 1)" }], { duration: 760, delay: 160 });
    await open; await wait(900);

    // 4. the first prompt types itself
    btn.style.opacity = 0;
    root.classList.remove("intro");
    cmd.textContent = "";
    const caret = Object.assign(document.createElement("span"), { className: "caret" });
    cmd.after(caret);
    btn.style.opacity = "";
    await pass(btn, [{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "none" }], { duration: 320 });
    for (const ch of COMMAND) { cmd.textContent += ch; await wait(22); }
    await wait(700);
    caret.remove();

    // 5. the wordmark and the prompt part, and the windmill comes in between them
    run(mark, [{ transform: "translateY(0)" }, { transform: "translateY(-214px)" }], { duration: 760, easing: INOUT });
    run(btn, [{ transform: "translateY(0)" }, { transform: "translateY(136px)" }], { duration: 760, easing: INOUT });
    await wait(300);
    run(mill_el, [{ opacity: 0 }, { opacity: 1 }], { duration: 900 });
    showMill();
  }

  btn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(COMMAND); } catch { return; }
    btn.classList.add("is-copied");
    setTimeout(() => btn.classList.remove("is-copied"), 1400);
  });
</script>
</body>
</html>
