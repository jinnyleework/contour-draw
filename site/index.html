<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contour draw</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css">
<script>try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "light"; } catch {}</script>
<script>if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("intro");</script>
</head>
<body>
<header class="top">
  <a class="mark" href="index.html" aria-label="Home"><img src="assets/logo-slices.svg" alt=""></a>
  <nav aria-label="Main">
    <a href="library.html">library</a>
    <a href="skill.html">skill</a>
    <a href="info.html">start</a>
    <a class="tech" href="technicals.html">technicals</a>
  </nav>
</header>
<main class="home">
  <h1 class="wordmark" id="wordmark" aria-label="contour draw">
    <span class="w">contour</span><span class="slot"><img src="assets/logo-slices.svg" alt=""></span><span class="w">draw</span>
  </h1>
  <div class="stage" id="stage" role="link" tabindex="0" aria-label="open the library"></div>
  <p class="stage-hint" id="hint"></p>
  <button class="install" id="install" type="button" aria-label="Copy the first prompt">
    <span class="dollar">&gt;</span><span class="cmd">/draw-contour a lighthouse whose beam sweeps as you move across it</span><span class="copied">copied</span>
  </button>
</main>
<script src="assets/contour-figures.js"></script>
<script src="assets/figure.js"></script>
<script src="assets/theme.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const btn = $("install"), cmd = btn.querySelector(".cmd"), COMMAND = cmd.textContent;
  // the land: a peak rises under the cursor wherever it goes
  const land = Contour.mount($("stage"), "terrain", { label: "a terrain drawn as contour slices: a peak rises under the cursor" });
  land.show();
  $("hint").textContent = land.hint;
  if (document.documentElement.classList.contains("intro")) opening();
  // the land opens the library, by a click or by Enter
  const start = () => (location.href = "library.html");
  $("stage").addEventListener("click", start);
  $("stage").addEventListener("keydown", (e) => { if (e.key === "Enter") start(); });

  /*
   * The opening: the words fade in one by one; they part and the logo comes in between them, tilted, and turns
   * upright; the title rises from the centre of the page to its place; the land fades in and plays its action once;
   * and the first prompt types itself.
   */
  async function opening() {
    const root = document.documentElement, mark = $("wordmark"), slot = mark.querySelector(".slot"), logo = slot.querySelector("img");
    const words = [...mark.querySelectorAll(".w")], stage = $("stage"), hint = $("hint");
    const EASE = "cubic-bezier(0.23, 1, 0.32, 1)", INOUT = "cubic-bezier(0.65, 0, 0.35, 1)";
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const run = (el, frames, o) => el.animate(frames, { fill: "forwards", easing: EASE, ...o }).finished;
    // an animation that hands the element back to its own styles when it ends, cancelling only itself
    const pass = (el, frames, o) => { const a = el.animate(frames, { fill: "forwards", easing: EASE, ...o }); return a.finished.then(() => a.cancel()); };

    // hold the title at the centre of the page; it rises to its place later
    const r0 = mark.getBoundingClientRect(), dy = innerHeight / 2 - (r0.top + r0.height / 2);
    mark.style.transform = `translateY(${dy}px)`;

    // 1. the words, one by one
    words.forEach((w, i) => run(w, [{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "none" }], { duration: 420, delay: i * 140 }));
    await wait(words.length * 140 + 420 + 200);

    // 2. they part, and the logo comes in between them, tilted, then turns upright
    const open = run(slot, [{ width: "0px", marginLeft: "-0.27em", marginRight: "0px" }, { width: "26px", marginLeft: "2px", marginRight: "2px" }], { duration: 520 });
    run(logo, [{ opacity: 0, transform: "rotate(43.88deg) scale(0.8)" }, { opacity: 1, transform: "rotate(43.88deg)" }], { duration: 420, delay: 160 });
    await open; await wait(200);
    await run(logo, [{ opacity: 1, transform: "rotate(43.88deg)" }, { opacity: 1, transform: "rotate(0deg)" }], { duration: 760, easing: INOUT });
    await wait(200);

    // 3. the title rises to its place
    await run(mark, [{ transform: `translateY(${dy}px)` }, { transform: "translateY(0)" }], { duration: 760, easing: INOUT });
    mark.style.transform = ""; mark.getAnimations().forEach((a) => a.cancel());

    // 4. the land fades in and shows what it does, once
    btn.style.opacity = 0; hint.style.opacity = 0; stage.style.pointerEvents = "none";
    root.classList.remove("intro");
    await pass(stage, [{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 900 });
    land.demo();
    stage.style.pointerEvents = "";
    pass(hint, [{ opacity: 0 }, { opacity: 1 }], { duration: 420 }).then(() => (hint.style.opacity = ""));

    // 5. the first prompt types itself
    cmd.textContent = "";
    const caret = Object.assign(document.createElement("span"), { className: "caret" });
    cmd.after(caret);
    btn.style.opacity = "";
    await pass(btn, [{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "none" }], { duration: 320 });
    for (const ch of COMMAND) { cmd.textContent += ch; await wait(22); }
    await wait(700);
    caret.remove();
  }

  btn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(COMMAND); } catch { return; }
    btn.classList.add("is-copied");
    setTimeout(() => btn.classList.remove("is-copied"), 1400);
  });
</script>
</body>
</html>
