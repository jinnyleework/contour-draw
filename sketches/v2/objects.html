<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slices</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; }
  body { display: grid; place-items: center; }
  svg { width: min(92vmin, 760px); height: auto; display: block; cursor: grab; touch-action: none; }
  svg:active { cursor: grabbing; }
  .slice { fill: #0b0b0c; stroke: #e6e6e6; stroke-width: 0.9; stroke-linejoin: round; fill-rule: evenodd; vector-effect: non-scaling-stroke; }
  nav { position: fixed; top: 14px; left: 14px; display: flex; gap: 6px; flex-wrap: wrap; font: 11px/1 ui-monospace, Menlo, monospace; }
  nav button { font: inherit; padding: 8px 10px; background: none; color: #8a8a90; border: 1px solid #29292d; border-radius: 6px; cursor: pointer; }
  nav button[aria-pressed="true"] { color: #e6e6e6; border-color: #e6e6e6; }
</style>
</head>
<body>
<nav id="nav"></nav>
<svg id="art" viewBox="0 0 600 600" aria-label="An object drawn as stacked slices"></svg>
<script>
/* ---------- settings ---------- */
const CFG = {
  N: 160,        // grid cells per slice side: more = smoother lines
  gap: 0.03,     // world distance between slices: smaller = more lines
  scale: 175,    // px per world unit
  azimuth: 35,   // degrees; drag to change
  tilt: 0.5,     // sin(elevation); drag up/down to change
  object: "rocket",
};
const BOX = 1.15; // every object lives inside [-1, 1]; the slice grid covers +-BOX

/* ---------- 1. shapes: signed distance functions (negative inside) ---------- */
const len2 = (a, b) => Math.hypot(a, b);
const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; };
const roundBox = (x, y, z, bx, by, bz, r) => {
  const qx = Math.abs(x) - bx, qy = Math.abs(y) - by, qz = Math.abs(z) - bz;
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qy, qz), 0) - r;
};
const subtract = (a, b) => Math.max(a, -b);

const OBJECTS = {
  sphere: { z: [-0.82, 0.82], sdf: (x, y, z) => Math.hypot(x, y, z) - 0.8 },
  torus: { z: [-0.3, 0.3], sdf: (x, y, z) => len2(len2(x, y) - 0.6, z) - 0.27 },
  vase: {
    z: [-0.92, 0.92],
    sdf: (x, y, z) => {
      const t = (z + 0.9) / 1.8, r = 0.26 + 0.38 * Math.exp(-(((t - 0.33) / 0.24) ** 2)) + 0.14 * Math.exp(-(((t - 1) / 0.1) ** 2));
      const rho = len2(x, y);
      return subtract(Math.max(rho - r, Math.abs(z) - 0.9), Math.max(rho - (r - 0.07), -0.8 - z));
    },
  },
  mug: {
    z: [-0.5, 0.5],
    sdf: (x, y, z) => {
      const rho = len2(x, y);
      const body = subtract(Math.max(rho - 0.55, Math.abs(z) - 0.45), Math.max(rho - 0.47, -0.33 - z));
      const handle = len2(len2(x - 0.6, z) - 0.27, y) - 0.075;
      return Math.min(body, handle);
    },
  },
  stack: {
    z: [-0.92, 0.92],
    sdf: (x, y, z) => smin(smin(
      roundBox(x, y, z + 0.6, 0.62, 0.62, 0.28, 0.08),
      roundBox(x, y, z, 0.42, 0.42, 0.24, 0.08), 0.12),
      roundBox(x, y, z - 0.55, 0.24, 0.24, 0.3, 0.08), 0.12),
  },
};

/* a rounded cylinder: `ra` is the distance from its axis, `c` the position along it, from c0 to c1, edges rounded by rr */
const rcyl = (ra, c, r, c0, c1, rr) => {
  const q1 = ra - (r - rr), q2 = Math.abs(c - (c0 + c1) / 2) - ((c1 - c0) / 2 - rr);
  return Math.hypot(Math.max(q1, 0), Math.max(q2, 0)) + Math.min(Math.max(q1, q2), 0) - rr;
};

Object.assign(OBJECTS, {
  /* two barrels lying along y, each with an objective bell, an eyepiece and a recessed lens; a hinge and a focus wheel between */
  binoculars: {
    z: [-0.42, 0.5],
    sdf: (x, y, z) => {
      const barrel = (s) => {
        const cx = s * 0.36, R = (rad, y0, y1, rr) => rcyl(len2(x - cx, z), y, rad, y0, y1, rr);
        let d = smin(R(0.3, -0.4, 0.4, 0.06), R(0.35, 0.3, 0.78, 0.05), 0.05);
        d = smin(d, R(0.2, -0.72, -0.3, 0.04), 0.05);
        return subtract(subtract(d, R(0.29, 0.7, 0.95, 0)), R(0.12, -0.9, -0.64, 0));
      };
      const hinge = rcyl(len2(x, z - 0.08), y, 0.1, -0.3, 0.3, 0.05);
      const wheel = rcyl(len2(y, z - 0.3), x, 0.12, -0.2, 0.2, 0.03);
      return smin(smin(Math.min(barrel(-1), barrel(1)), hinge, 0.06), wheel, 0.04);
    },
  },
  /* a revolved ogive nose, a body with two portholes, a flared engine skirt with a hollow nozzle, and three swept fins */
  rocket: {
    z: [-0.86, 0.98],
    sdf: (x, y, z) => {
      const rho = len2(x, y), t = (z - 0.3) / 0.67;
      const r = z > 0.3 ? 0.28 * Math.pow(Math.max(0, 1 - t), 0.65) : z > -0.6 ? 0.28 : 0.17 + (-0.6 - z) * 0.4;
      let d = Math.max(rho - r, z - 0.97, -0.85 - z);
      d = subtract(d, Math.max(rho - 0.12, z + 0.72));
      const f = 0.96, u0 = x * Math.cos(f) + y * Math.sin(f), v0 = -x * Math.sin(f) + y * Math.cos(f);   // portholes face the default view
      d = subtract(d, rcyl(len2(v0, z - 0.1), u0, 0.12, 0.2, 0.5, 0));
      d = subtract(d, rcyl(len2(v0, z + 0.2), u0, 0.07, 0.2, 0.5, 0));
      for (let k = 0; k < 3; k++) {
        const a = f + Math.PI / 3 + (k * 2 * Math.PI) / 3, u = x * Math.cos(a) + y * Math.sin(a), v = -x * Math.sin(a) + y * Math.cos(a);
        const fin = Math.max(Math.abs(v) - 0.03, 0.15 - u, -0.7 - z, z + 0.1, (u - (0.62 - 0.55 * (z + 0.7))) * 0.8);
        d = smin(d, fin, 0.04);
      }
      return d;
    },
  },
  /* a rounded body with a prism hump, a grip, a stepped lens with a recessed glass, a shutter button and a mode dial */
  camera: {
    z: [-0.4, 0.56],
    sdf: (x, y, z) => {
      let d = smin(roundBox(x, y, z, 0.74, 0.18, 0.3, 0.06), roundBox(x, y + 0.02, z - 0.38, 0.18, 0.12, 0.1, 0.05), 0.03);
      d = smin(d, roundBox(x - 0.62, y - 0.2, z, 0.1, 0.06, 0.28, 0.04), 0.04);
      const lr = len2(x - 0.12, z);
      d = smin(d, rcyl(lr, y, 0.31, 0.1, 0.26, 0.04), 0.03);
      d = Math.min(d, rcyl(lr, y, 0.26, 0.1, 0.42, 0.05));
      d = subtract(d, rcyl(lr, y, 0.2, 0.34, 0.6, 0));
      d = Math.min(d, rcyl(lr, y, 0.12, 0.3, 0.4, 0.03));
      d = subtract(d, roundBox(x + 0.55, y - 0.24, z - 0.12, 0.08, 0.03, 0.05, 0.01));
      return Math.min(d, rcyl(len2(x - 0.55, y), z, 0.07, 0.26, 0.36, 0.02), rcyl(len2(x + 0.5, y), z, 0.12, 0.26, 0.36, 0.03));
    },
  },
});

/* ---------- 2. marching squares: a grid of values -> closed loops of grid points (as in v1) ---------- */
function contour(f, N, L) {
  const W = N + 1, at = (i, j) => f[j * W + i];
  const adj = new Map(), pos = new Map();
  const point = (key) => {
    let p = pos.get(key); if (p) return p;
    const [k, i, j] = key.split(",").map((s, n) => n ? +s : s);
    const [i2, j2] = k === "h" ? [i + 1, j] : [i, j + 1];
    const v0 = at(i, j), v1 = at(i2, j2), t = (L - v0) / (v1 - v0);
    p = [i + (i2 - i) * t, j + (j2 - j) * t]; pos.set(key, p); return p;
  };
  const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = at(i, j) >= L, b = at(i + 1, j) >= L, c = at(i + 1, j + 1) >= L, d = at(i, j + 1) >= L;
    const top = `h,${i},${j}`, right = `v,${i + 1},${j}`, bottom = `h,${i},${j + 1}`, left = `v,${i},${j}`;
    const cross = [];
    if (a !== b) cross.push(top); if (b !== c) cross.push(right); if (d !== c) cross.push(bottom); if (a !== d) cross.push(left);
    if (cross.length === 2) link(cross[0], cross[1]);
    else if (cross.length === 4) {
      const mid = (at(i, j) + at(i + 1, j) + at(i + 1, j + 1) + at(i, j + 1)) / 4 >= L;
      if (mid === a) { link(top, right); link(left, bottom); } else { link(top, left); link(right, bottom); }
    }
  }
  const loops = [], seen = new Set();
  for (const start of adj.keys()) {
    if (seen.has(start)) continue;
    const loop = []; let prev = null, cur = start;
    while (cur && !seen.has(cur)) {
      seen.add(cur); loop.push(point(cur));
      const next = adj.get(cur).find((n) => n !== prev && !seen.has(n)); prev = cur; cur = next;
    }
    if (loop.length > 3) loops.push(loop);
  }
  return loops;
}

/* ---------- 3. slice an object: one cross-section per height, in world units ---------- */
function slice(obj, N, gap) {
  const [z0, z1] = obj.z, levels = Math.max(2, Math.round((z1 - z0) / gap)), out = [], f = new Float32Array((N + 1) * (N + 1));
  const w = (i) => -BOX + (2 * BOX * i) / N;
  for (let k = 0; k < levels; k++) {
    const z = z0 + ((k + 0.5) / levels) * (z1 - z0);
    for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) f[j * (N + 1) + i] = -obj.sdf(w(i), w(j), z);   // inside is positive
    const loops = contour(f, N, 0).map((loop) => loop.map(([i, j]) => [w(i), w(j)]));
    if (loops.length) out.push({ z, loops });
  }
  return out;
}

/* ---------- 4. camera and painter: slices bottom-up, each opaque ---------- */
function camera({ azimuth, tilt, scale }) {
  const az = (azimuth * Math.PI) / 180, c = Math.cos(az), s = Math.sin(az), zf = Math.sqrt(1 - tilt * tilt);
  return (x, y, z) => [300 + scale * (x * c - y * s), 330 + scale * ((x * s + y * c) * tilt - z * zf)];
}
function draw(svg, slices, cfg) {
  const P = camera(cfg), r2 = (n) => Math.round(n * 100) / 100;
  svg.innerHTML = slices.map(({ z, loops }) =>
    `<path class="slice" d="${loops.map((l) => "M" + l.map(([x, y]) => P(x, y, z).map(r2).join(" ")).join("L") + "Z").join("")}"/>`).join("");
}

/* ---------- 5. page: choose an object, drag to look around ---------- */
const svg = document.getElementById("art"), nav = document.getElementById("nav"), cache = {};
function show(name) {
  CFG.object = name;
  cache[name] ||= slice(OBJECTS[name], CFG.N, CFG.gap);
  draw(svg, cache[name], CFG);
  [...nav.children].forEach((b) => b.setAttribute("aria-pressed", String(b.textContent === name)));
}
for (const name of Object.keys(OBJECTS)) {
  const b = document.createElement("button"); b.textContent = name; b.onclick = () => show(name); nav.appendChild(b);
}
let drag = null;
svg.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, az: CFG.azimuth, tilt: CFG.tilt }; svg.setPointerCapture(e.pointerId); });
svg.addEventListener("pointermove", (e) => {
  if (!drag) return;
  if (!(e.buttons & 1)) { drag = null; return; }   // the button was let go somewhere we did not hear about
  CFG.azimuth = drag.az - (e.clientX - drag.x) * 0.4;
  CFG.tilt = Math.min(0.95, Math.max(0.15, drag.tilt + (e.clientY - drag.y) * 0.003));
  draw(svg, cache[CFG.object], CFG);
});
for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) svg.addEventListener(t, () => { drag = null; });
const want = new URLSearchParams(location.search).get("obj");
show(OBJECTS[want] ? want : CFG.object);
</script>
</body>
</html>
