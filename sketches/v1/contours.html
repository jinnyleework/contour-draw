<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contours</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; }
  body { display: grid; place-items: center; }
  svg { width: min(92vmin, 760px); height: auto; display: block; cursor: pointer; }
  .slice { fill: #0b0b0c; stroke: #e6e6e6; stroke-width: 0.9; stroke-linejoin: round; fill-rule: evenodd; vector-effect: non-scaling-stroke; }
  .slice path { vector-effect: non-scaling-stroke; }
</style>
</head>
<body>
<svg id="art" viewBox="0 0 600 560" aria-label="Contour slices of a mountain"></svg>
<script>
/* ---------- settings: change these and reload; click the drawing for a new seed ---------- */
const CFG = {
  N: 180,          // grid cells per side: more = smoother lines
  levels: 44,      // number of slices
  height: 250,     // screen height of the tallest slice, px in the 600 x 560 box
  scale: 3.3,      // ground scale
  azimuth: 45,     // degrees
  tilt: 0.5,       // sin(elevation): 0.5 is the 2:1 iso view
  rough: 1.0,     // how much noise breaks up the smooth peaks
  seed: 42,
};

/* ---------- 1. a heightfield: peaks + noise, falling to zero at the edge ---------- */
function rng(seed) { // mulberry32
  return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function makeField(N, seed, rough) {
  const rand = rng(seed);
  const lattice = Array.from({ length: 4 }, () => Array.from({ length: 34 * 34 }, rand));
  const smooth = (t) => t * t * (3 - 2 * t);
  const noise = (o, x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), fx = smooth(x - xi), fy = smooth(y - yi), L = lattice[o];
    const g = (i, j) => L[(j % 34) * 34 + (i % 34)];
    const a = g(xi, yi), b = g(xi + 1, yi), c = g(xi, yi + 1), d = g(xi + 1, yi + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  };
  const fbm = (u, v) => { let s = 0, amp = 0.5, f = 4;
    for (let o = 0; o < 4; o++) { s += amp * noise(o, u * f, v * f); amp /= 2; f *= 2; } return s; };
  // the summit sits off-centre; ridges run out of it at random angles; a broad skirt and ridged noise do the rest
  const sx = 0.5 + (rand() - 0.5) * 0.12, sy = 0.46 + (rand() - 0.5) * 0.1;
  const a0 = rand() * Math.PI * 2;
  const ridges = Array.from({ length: 4 }, (_, i) => ({
    ang: a0 + (i / 4) * Math.PI * 2 + (rand() - 0.5) * 0.9, len: 0.34 + rand() * 0.2,
    w: 0.035 + rand() * 0.03, a: 0.55 + rand() * 0.4,
  }));
  const knolls = Array.from({ length: 3 }, () => ({ x: 0.5 + (rand() - 0.5) * 0.7, y: 0.5 + (rand() - 0.5) * 0.7, r: 0.04 + rand() * 0.05, a: 0.1 + rand() * 0.15 }));
  const ridged = (u, v) => { let s = 0, amp = 0.5, f = 5;
    for (let o = 0; o < 3; o++) { s += amp * (1 - Math.abs(2 * noise(o, u * f, v * f) - 1)); amp /= 2; f *= 2; } return s; };
  const f = new Float32Array((N + 1) * (N + 1));
  let max = 0;
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    // domain warp: the whole shape wobbles, so no line is a clean circle
    let u = i / N, v = j / N;
    const wu = u + 0.05 * (fbm(u + 3.1, v) - 0.45), wv = v + 0.05 * (fbm(u, v + 7.7) - 0.45);
    const dx = wu - sx, dy = wv - sy, d = Math.hypot(dx, dy);
    let h = 0.5 * Math.exp(-((d / 0.13) ** 2)) + 0.12 * Math.exp(-(d * d) / (2 * 0.14 * 0.14));   // a pointed summit on a shoulder
    for (const r of ridges) {
      const ca = Math.cos(r.ang), sa = Math.sin(r.ang), along = dx * ca + dy * sa, perp = -dx * sa + dy * ca;
      h += r.a / (1 + Math.exp(-along / 0.06)) * Math.exp(-(perp * perp) / (2 * r.w * r.w * Math.max(0.3, 1 + along * 4))) * Math.exp(-((Math.max(0, along) / r.len) ** 1.3));
    }
    for (const k of knolls) h += k.a * Math.exp(-((wu - k.x) ** 2 + (wv - k.y) ** 2) / (2 * k.r * k.r));
    h += 0.1 * Math.exp(-((wu - 0.5) ** 2 + (wv - 0.52) ** 2) / (2 * 0.2 * 0.2));          // the wide skirt
    h += rough * 0.5 * (ridged(wu, wv) - 0.5) * Math.min(1, h * 3);                      // ridged noise, only where there is ground
    const e = Math.hypot(u - 0.5, v - 0.5);
    const edge = Math.max(0, Math.min(1, (0.45 - e) / 0.15));                                // 1 inside, 0 at the border
    h = Math.max(0, h) * edge * edge * (3 - 2 * edge);
    f[j * (N + 1) + i] = h; if (h > max) max = h;
  }
  for (let k = 0; k < f.length; k++) f[k] /= max;
  return f;
}

/* ---------- 2. marching squares: one level -> closed loops of grid points ---------- */
function contour(f, N, L) {
  const W = N + 1, at = (i, j) => f[j * W + i];
  const adj = new Map(), pos = new Map();
  const point = (key) => {
    let p = pos.get(key); if (p) return p;
    const [k, i, j] = key.split(",").map((s, n) => n ? +s : s);
    const [i2, j2] = k === "h" ? [i + 1, j] : [i, j + 1];
    const v0 = at(i, j), v1 = at(i2, j2), t = (L - v0) / (v1 - v0);
    p = [i + (i2 - i) * t, j + (j2 - j) * t]; pos.set(key, p); return p;
  };
  const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = at(i, j) >= L, b = at(i + 1, j) >= L, c = at(i + 1, j + 1) >= L, d = at(i, j + 1) >= L;
    const top = `h,${i},${j}`, right = `v,${i + 1},${j}`, bottom = `h,${i},${j + 1}`, left = `v,${i},${j}`;
    const cross = [];
    if (a !== b) cross.push(top); if (b !== c) cross.push(right); if (d !== c) cross.push(bottom); if (a !== d) cross.push(left);
    if (cross.length === 2) link(cross[0], cross[1]);
    else if (cross.length === 4) {                                   // saddle: ask the cell's centre
      const mid = (at(i, j) + at(i + 1, j) + at(i + 1, j + 1) + at(i, j + 1)) / 4 >= L;
      if (mid === a) { link(top, right); link(left, bottom); } else { link(top, left); link(right, bottom); }
    }
  }
  const loops = [], seen = new Set();
  for (const start of adj.keys()) {
    if (seen.has(start)) continue;
    const loop = []; let prev = null, cur = start;
    while (cur && !seen.has(cur)) {
      seen.add(cur); loop.push(point(cur));
      const next = adj.get(cur).find((n) => n !== prev && !seen.has(n)); prev = cur; cur = next;
    }
    if (loop.length > 3) loops.push(loop);
  }
  return loops;
}

/* ---------- 3. the camera: world (x, y, z) -> screen ---------- */
function camera(N, { azimuth, tilt, scale, height }) {
  const az = (azimuth * Math.PI) / 180, c = Math.cos(az), s = Math.sin(az);
  return (x, y, z) => {
    const X = (x - N / 2) * c - (y - N / 2) * s, Y = (x - N / 2) * s + (y - N / 2) * c;
    return [300 + scale * X, 400 + scale * Y * tilt - z * height];
  };
}

/* ---------- 4. draw: slices from the bottom up, each opaque, so higher ones cover lower ones ---------- */
function draw(svg, cfg) {
  const { N, levels } = cfg, f = makeField(N, cfg.seed, cfg.rough), P = camera(N, cfg);
  const r2 = (n) => Math.round(n * 100) / 100;
  let out = "";
  for (let k = 0; k < levels; k++) {
    const L = 0.012 + (k / levels) * 0.95, z = L;
    const d = contour(f, N, L).map((loop) =>
      "M" + loop.map(([x, y]) => P(x, y, z).map(r2).join(" ")).join("L") + "Z").join("");
    if (d) out += `<path class="slice" d="${d}"/>`;
  }
  svg.innerHTML = out;
}

const svg = document.getElementById("art");
const params = new URLSearchParams(location.search);
if (params.has("seed")) CFG.seed = +params.get("seed");
draw(svg, CFG);
svg.addEventListener("click", () => { CFG.seed = Math.floor(Math.random() * 1e6); draw(svg, CFG); try { history.replaceState(null, "", "?seed=" + CFG.seed); } catch {} });
</script>
</body>
</html>
